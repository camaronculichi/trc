<!DOCTYPE html>
<html lang="es" class="is-loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Camarón Culichi</title>
    <link rel="stylesheet" href="loader.css">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preload" as="image" href="logo.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');

        :root {
            --fondo: url('FONDOT.webp');
            --gal-ratio: 4 / 5;
            --gal-n: 0.8;
        }

        html, body {
            font-family: 'Poppins', sans-serif;
            background-image: var(--fondo);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #06364f;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            color: white;
            margin: 0;
        }

        .logo-font { font-family: 'Playfair Display', serif; }
        .category-card {
            opacity: 0;
            transform: translateY(80px);
            transition: all 0.9s ease-out;
            border-radius: 1.75rem;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        .category-card.appear { opacity: 1; transform: translateY(0); }
        .category-card:hover {
            transform: scale(1.03) translateY(-8px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }
        .category-image-container {
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            height: 100%;
        }
        .category-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .category-image-container.no-cover {
            background: linear-gradient(135deg, #0e6f8f, #06364f 70%);
        }
        .category-card:hover .category-image-container img {
            transform: scale(1.07);
        }
        .category-label {
            text-align: center;
            padding: 8px 0;
        }
        .category-label h2 {
            font-size: 1.75rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9),
                         0 2px 4px rgba(0, 0, 0, 0.7);
            color: white;
        }

        /* Carrusel de fotos de cada sección: formato vertical, más grande */
        .auto-gallery {
            position: relative;
            aspect-ratio: var(--gal-ratio);
            width: min(100%, calc(68vh * var(--gal-n)));
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
            border-radius: 1.25rem;
            box-shadow: 0 14px 30px rgba(0,0,0,0.55);
            background: rgba(255,255,255,0.06);
        }
        .auto-gallery .slides img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }
        .auto-gallery .slides img.active { opacity: 1; }
        .gallery-dots {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 2;
        }
        .gallery-dots span {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.5);
            transition: all .3s ease;
        }
        .gallery-dots span.on { background: #ff8c00; width: 20px; }

        .modal {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.4s cubic-bezier(0.34, 1.1, 0.64, 1.1);
            background-image: var(--fondo);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .modal.show { opacity: 1; transform: scale(1); }
        .modal-content {
            background: rgba(5, 5, 15, 0.88);
            backdrop-filter: blur(14px);
        }

        /* X sticky - se queda visible mientras deslizas en secciones largas */
        .close-modal {
            position: sticky;
            top: 20px;
            right: 20px;
            z-index: 50;
            margin-left: auto;
            display: block;
        }

        /* Filas del menú */
        .item { border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 0.75rem; }
        .item-row { display: flex; justify-content: space-between; gap: 1rem; }
        .item-row .price { color: #ff8c00; white-space: nowrap; }
        .item-row.sub span:first-child { padding-left: 1.25rem; color: rgba(255,255,255,0.8); }
        .item-desc { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-top: 0.25rem; }

        body.modal-open { overflow: hidden; }

        @media (max-width: 768px) {
            html, body {
                background-attachment: scroll;
                background-size: cover;
                background-position: top;
            }
            .category-card {
                padding: 8px;
                margin-bottom: 1rem;
            }
            .category-image-container {
                border-radius: 1.25rem;
            }
            .category-label h2 {
                font-size: 1.5rem;
            }
            main {
                padding-top: 6rem;
                padding-bottom: 3rem;
            }
            .close-modal {
                top: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body class="overflow-x-hidden">

<!-- ==================== PANTALLA DE CARGA ==================== -->
<div id="page-loader" role="status" aria-live="polite" data-manual>
    <div class="loader-orb">
        <div class="loader-water">
            <svg class="w2" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q75 0 150 20 T300 20 T450 20 T600 20 T750 20 T900 20 T1050 20 T1200 20 V40 H0 Z"/></svg>
            <svg class="w1" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q75 0 150 20 T300 20 T450 20 T600 20 T750 20 T900 20 T1050 20 T1200 20 V40 H0 Z"/></svg>
        </div>
        <img src="logo.webp" alt="" class="loader-logo">
    </div>
    <div class="loader-text">Cargando menú<span class="loader-percent">0%</span></div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <div class="loader-sea" aria-hidden="true">
        <svg class="s1" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 100 Q90 40 180 100 T360 100 T540 100 T720 100 T900 100 T1080 100 T1260 100 T1440 100 V200 H0 Z"/></svg>
        <svg class="s2" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 120 Q90 70 180 120 T360 120 T540 120 T720 120 T900 120 T1080 120 T1260 120 T1440 120 V200 H0 Z"/></svg>
        <svg class="s3" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 145 Q90 105 180 145 T360 145 T540 145 T720 145 T900 145 T1080 145 T1260 145 T1440 145 V200 H0 Z"/></svg>
    </div>
</div>

<header class="fixed top-0 left-0 right-0 z-40 bg-black/40 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2 text-white hover:text-orange-400 transition-colors">
            <img src="FLECHA.webp" alt="Regresar" class="w-9 h-9 object-contain">
            <span class="text-xs font-medium tracking-wider hidden sm:block">REGRESAR AL INICIO</span>
        </a>
        <img id="site-logo" src="logo.webp" alt="Camarón Culichi" class="h-20 w-auto drop-shadow-xl">
        <div class="w-9"></div>
    </div>
</header>

<main class="pt-24 pb-10 px-4 sm:px-6 max-w-5xl mx-auto">
    <div id="cards" class="space-y-6 sm:space-y-7 mt-12"></div>
</main>

<footer id="site-footer" class="max-w-5xl mx-auto px-4 pb-12 text-center text-white/85 text-sm space-y-2"></footer>

<div id="modals"></div>

<script src="menu-data.js"></script>
<script src="loader.js"></script>
<script type="module">
    import { loadSite, loadMenu, resolveImage, ratioNumber } from './culichi-db.js';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const priceText = (p) => {
        const t = String(p ?? '').trim().replace(/^\$\s*/, '');
        return t ? '$' + t : '';
    };

    const [site, menu] = await Promise.all([loadSite(), loadMenu()]);
    const sections = (menu.sections || []).filter((s) => s && s.nombre);

    /* ---------- Configuración del sitio ---------- */
    const root = document.documentElement.style;
    const fondoSrc = await resolveImage(site.fondo);
    if (fondoSrc) root.setProperty('--fondo', `url("${fondoSrc}")`);
    root.setProperty('--gal-ratio', String(site.formatoCarrusel || '4/5').replace('/', ' / '));
    root.setProperty('--gal-n', String(ratioNumber(site.formatoCarrusel)));

    const logoSrc = await resolveImage(site.logo);
    if (logoSrc) document.getElementById('site-logo').src = logoSrc;

    const tel = String(site.telefono || '').replace(/[^\d+]/g, '');
    const wa = String(site.whatsapp || '').replace(/\D/g, '');
    document.getElementById('site-footer').innerHTML = [
        site.telefono ? `<p><a class="hover:text-[#ff8c00]" href="tel:${esc(tel)}">📞 ${esc(site.telefono)}</a>${wa ? ` &nbsp;·&nbsp; <a class="hover:text-[#ff8c00]" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</p>` : '',
        site.direccion ? `<p>${site.maps ? `<a class="hover:text-[#ff8c00]" href="${esc(site.maps)}" target="_blank" rel="noopener">📍 ${esc(site.direccion)}</a>` : `📍 ${esc(site.direccion)}`}</p>` : ''
    ].join('');

    /* ---------- Tarjetas de secciones ---------- */
    const covers = await Promise.all(sections.map((s) => resolveImage(s.portada)));
    document.getElementById('cards').innerHTML = sections.map((s, i) => `
        <button data-modal="${esc(s.id)}" class="category-card w-full aspect-video relative">
            <div class="category-image-container ${covers[i] ? '' : 'no-cover'}">
                ${covers[i] ? `<img src="${esc(covers[i])}" alt="${esc(s.nombre)}" decoding="async">` : ''}
            </div>
            <div class="absolute inset-x-0 bottom-6"><div class="category-label"><h2 class="logo-font">${esc(s.nombre)}</h2></div></div>
        </button>`).join('');

    /* ---------- Modales ---------- */
    const renderItems = (items) => (items || []).filter((it) => it && it.nombre).map((it) => `
        <div class="item">
            <div class="item-row${it.sub ? ' sub' : ''}"><span>${esc(it.nombre)}</span><span class="price">${esc(priceText(it.precio))}</span></div>
            ${it.desc ? `<p class="item-desc">${esc(it.desc)}</p>` : ''}
        </div>`).join('');

    const renderGroups = (grupos) => {
        const gs = (grupos || []).filter((g) => g && (g.items || []).length);
        const titled = gs.some((g) => g.titulo);
        if (!titled) return `<div class="space-y-4 text-base sm:text-lg">${gs.map((g) => renderItems(g.items)).join('')}</div>`;
        return `<div class="space-y-8 text-base sm:text-lg">${gs.map((g) => `
            <div>
                ${g.titulo ? `<h3 class="logo-font text-3xl text-white mb-4 border-b border-white/30 pb-2">${esc(g.titulo)}</h3>` : ''}
                <div class="space-y-3">${renderItems(g.items)}</div>
            </div>`).join('')}</div>`;
    };

    document.getElementById('modals').innerHTML = sections.map((s) => {
        const fotos = (s.fotos || []).filter(Boolean);
        return `
        <div id="modal-${esc(s.id)}" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6 pointer-events-none">
            <div class="modal-content rounded-3xl w-full max-w-2xl max-h-[92vh] overflow-y-auto relative border border-white/15 shadow-2xl">
                <button class="close-modal text-5xl text-white/80 hover:text-[#ff8c00] transition" aria-label="Cerrar">×</button>
                <div class="p-6 sm:p-12">
                    <h2 class="logo-font text-4xl sm:text-5xl font-bold text-center text-[#ff8c00] mb-8">${esc(s.nombre)}</h2>
                    ${fotos.length ? `
                    <div class="auto-gallery mb-8">
                        <div class="slides">${fotos.map((f, i) => `<img data-ref="${esc(f)}" class="slide${i === 0 ? ' active' : ''}" alt="" loading="lazy">`).join('')}</div>
                        ${fotos.length > 1 ? `<div class="gallery-dots">${fotos.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('')}</div>` : ''}
                    </div>` : ''}
                    ${renderGroups(s.grupos)}
                </div>
            </div>
        </div>`;
    }).join('');

    /* ---------- Animación de aparición ---------- */
    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) {
                entry.target.classList.add('appear');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.25 });
    document.querySelectorAll('.category-card').forEach((card) => observer.observe(card));

    /* ---------- Abrir / cerrar ---------- */
    const timers = new Map();

    function startCarousel(modal) {
        const gallery = modal.querySelector('.auto-gallery');
        if (!gallery) return;
        gallery.querySelectorAll('img[data-ref]').forEach((img) => {
            if (img.getAttribute('src')) return;
            resolveImage(img.dataset.ref).then((src) => { if (src) img.src = src; });
        });
        const slides = gallery.querySelectorAll('img');
        const dots = gallery.querySelectorAll('.gallery-dots span');
        if (slides.length < 2 || timers.has(modal)) return;
        let current = [...slides].findIndex((s) => s.classList.contains('active'));
        timers.set(modal, setInterval(() => {
            slides[current].classList.remove('active');
            dots[current]?.classList.remove('on');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
            dots[current]?.classList.add('on');
        }, 3500));
    }

    function openModal(id) {
        const modal = document.getElementById(`modal-${id}`);
        if (!modal) return;
        modal.classList.remove('hidden', 'pointer-events-none');
        document.body.classList.add('modal-open');
        startCarousel(modal);
        setTimeout(() => modal.classList.add('show'), 30);
    }

    function closeModal(modal) {
        modal.classList.remove('show');
        document.body.classList.remove('modal-open');
        clearInterval(timers.get(modal));
        timers.delete(modal);
        setTimeout(() => modal.classList.add('hidden', 'pointer-events-none'), 400);
    }

    document.querySelectorAll('[data-modal]').forEach((btn) => btn.addEventListener('click', () => openModal(btn.dataset.modal)));
    document.querySelectorAll('.close-modal').forEach((btn) => btn.addEventListener('click', () => closeModal(btn.closest('.modal'))));
    document.querySelectorAll('.modal').forEach((modal) => modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(modal); }));
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.querySelectorAll('.modal.show').forEach(closeModal);
    });

    window.PageLoader.begin();
</script>
<script>
    /* Si algo falla al cargar el módulo (sin internet, navegador viejo), no dejar la pantalla de carga atorada */
    window.addEventListener('error', function () { window.PageLoader && window.PageLoader.finish(); });
</script>
</body>
</html>
